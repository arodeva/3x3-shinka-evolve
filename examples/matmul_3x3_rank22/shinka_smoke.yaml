# Smoke-test config: minimal generations/budget to confirm the loop, model
# wiring, and scoring work end-to-end before committing to a longer/costlier
# run with shinka_small.yaml. Claude-only (no OpenAI/Gemini keys available);
# embedding-based dedup disabled since it requires an OpenAI/Gemini key.

max_evaluation_jobs: 2
max_proposal_jobs: 2
max_db_workers: 2

db_config:
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 1
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10
  archive_selection_strategy: "crowding"
  island_selection_strategy: equal
  archive_criteria:
    combined_score: 1.0
    loc: -0.3
  enable_dynamic_islands: false
  stagnation_threshold: 10
  island_spawn_strategy: "best"
  island_spawn_subtree_size: 2

evo_config:
  patch_types:
    - diff
    - full
    - cross
  patch_type_probs:
    - 0.6
    - 0.3
    - 0.1
  num_generations: 10
  max_api_costs: 2.0
  max_patch_resamples: 3
  max_patch_attempts: 1
  max_novelty_attempts: 1
  job_type: local
  language: python
  llm_models:
    - "claude-sonnet-4-6"
  llm_kwargs:
    temperatures:
      - 0
      - 0.5
      - 1.0
    reasoning_efforts:
      - low
      - medium
      - high
    max_tokens: 32768
  enable_controlled_oversubscription: false
  proposal_target_mode: adaptive
  proposal_target_min_samples: 8
  proposal_target_ratio_cap: 1.75
  proposal_buffer_max: 6
  proposal_target_hard_cap: 26
  proposal_target_ewma_alpha: 0.25

  meta_rec_interval: null
  meta_llm_models:
    - claude-sonnet-4-6
  meta_llm_kwargs:
    temperatures:
      - 0
    max_tokens: 16384

  # Disabled: requires an OpenAI/Gemini key we don't have. Code-dedup via
  # embeddings is an optimization, not required for the loop to function.
  embedding_model: null
  code_embed_sim_threshold: 0.99

  novelty_llm_models:
    - claude-sonnet-4-6
  novelty_llm_kwargs:
    temperatures:
      - 0
  init_program_path: initial.py

  llm_dynamic_selection: ucb1
  llm_dynamic_selection_kwargs:
    exploration_coef: 1.0
    cost_aware_coef: 0.5
  results_dir: results/results_matmul_3x3_rank22_smoke

  evolve_prompts: False
  prompt_evolution_interval: 5
  prompt_patch_types: ["diff", "full"]
  prompt_patch_type_probs: [0.5, 0.5]
  prompt_archive_size: 10
  prompt_percentile_recompute_interval: 1
  prompt_ucb_exploration_constant: 2.0
  prompt_epsilon: 0.25
